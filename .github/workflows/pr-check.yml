name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: guilhermelinosp/ci-templates/.github/workflows/shellcheck.yml@main

  merge-check:
    uses: guilhermelinosp/ci-templates/.github/workflows/merge-check.yml@main

  gitleaks:
    uses: guilhermelinosp/ci-templates/.github/workflows/gitleaks.yml@main

  labeler:
    uses: guilhermelinosp/ci-templates/.github/workflows/labeler.yml@main

  # Full Go quality gate (module integrity, vet, boundary guard via
  # extra-commands, race tests + coverage, canonical lint, build, smoke).
  go-quality:
    uses: guilhermelinosp/ci-templates/.github/workflows/go-quality.yml@main
    with:
      extra-commands: make verify
      build-command: make build
      smoke-command: ./bin/golang-cli-template --version

  dependency-review:
    uses: guilhermelinosp/ci-templates/.github/workflows/dependency-review.yml@main

  govulncheck:
    uses: guilhermelinosp/ci-templates/.github/workflows/govulncheck.yml@main

  codeql:
    uses: guilhermelinosp/ci-templates/.github/workflows/codeql.yml@main
