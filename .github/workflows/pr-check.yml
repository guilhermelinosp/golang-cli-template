name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    uses: guilhermelinosp/ci-templates/.github/workflows/shellcheck.yml@main

  merge-check:
    uses: guilhermelinosp/ci-templates/.github/workflows/merge-check.yml@main

  gitleaks:
    uses: guilhermelinosp/ci-templates/.github/workflows/gitleaks.yml@main

  labeler:
    uses: guilhermelinosp/ci-templates/.github/workflows/labeler.yml@main

  go-quality:
    uses: guilhermelinosp/ci-templates/.github/workflows/go-quality.yml@main
    with:
      extra-commands: make verify
      build-command: make build
      smoke-command: ./bin/golang-cli-template --version

  govulncheck:
    uses: guilhermelinosp/ci-templates/.github/workflows/govulncheck.yml@main
