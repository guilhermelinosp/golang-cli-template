name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@main

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@main

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@main

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@main

  # Full Go gate from the org reusable: module integrity, vet, boundary
  # guard, race tests + coverage, canonical lint, build smoke and
  # dependency review (embedded).
  go-quality:
    uses: guilhermelinosp/templates/.github/workflows/go-quality.yml@main
    with:
      extra-commands: make verify
      build-command: make build
      smoke-command: ./bin/golang-cli-template --version

  govulncheck:
    uses: guilhermelinosp/templates/.github/workflows/govulncheck.yml@main

# CodeQL runs via the per-repo inline workflow (.github/workflows/codeql.yml):
# the reusable variant still triggers GitHub-side startup_failure across
# callers regardless of content/pinning; revisit after a clean-room repro.
