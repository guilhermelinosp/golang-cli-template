# Self-contained Go quality gate (org pattern after the codeql decision in #5/#6:
# per-repo workflows instead of reusable ones). Runs on every PR touching Go.
name: go

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for git-describe versions

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module integrity
        run: |
          go mod verify
          go mod tidy && git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum out of sync — run 'go mod tidy' and commit"
            exit 1
          }

      - name: Architectural boundary guard
        run: make verify

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Build with stamped metadata
        run: make build

      - name: Smoke binary
        run: ./bin/golang-cli-template --version

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  govulncheck:
    name: vulnerability scan (stdlib-aware)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-package: ./...
