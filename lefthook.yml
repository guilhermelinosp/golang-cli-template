---
# lefthook.yml — pre-commit quality gates.
# Install once per clone: `lefthook install`
# Tools are non-fatal when locally absent (CI enforces them authoritatively).
output: false

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}
    vet:
      run: go vet ./...
    test:
      run: go test -count=1 ./...
    boundary:
      run: make verify
    yamllint:
      glob: "*.{yaml,yml}"
      # Inline style: no repo config file needed; keeps structural checks
      # (syntax, duplicate keys) and drops Actions-workflow style noise
      # ("on:" truthy, line length, doc start).
      run: >-
        yamllint -d "{extends: default, rules: {document-start: disable,
        truthy: {check-keys: false}, line-length: {max: 120},
        comments: {min-spaces-from-content: 1},
        comments-indentation: disable, empty-lines: {max: 1}}}" {staged_files}
    secrets-scan:
      glob: "*.{yaml,yml,go,json,sh}"
      run: gitleaks detect --source . --no-git --redact || true

commit-msg:
  commands:
    conventional:
      run: 'grep -Eq "^(feat|fix|docs|style|refactor|perf|test|ci|chore|revert|build)(\(.+\))?!?: .+" {1}'
